name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests and PostgreSQL access isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_only
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: ravecare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_only -d ravecare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable service credentials, never production. Suite resets this database.
      TEST_DATABASE_URL: postgresql://ci_only:ephemeral_ci_only@localhost:5432/ravecare_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan tracked files and history
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          -e GIT_CONFIG_COUNT=1
          -e GIT_CONFIG_KEY_0=safe.directory
          -e GIT_CONFIG_VALUE_0=/repo
          zricethezav/gitleaks:v8.24.3
          git /repo --redact --no-banner

  # Container build/publish and deployment are intentionally added after this
  # initial suite is green. No deployment target or production secrets exist yet.
