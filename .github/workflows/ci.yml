name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode verify

  e2e:
    name: Docker E2E
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: ravecare_ci
      POSTGRES_USER: ravecare_ci
      POSTGRES_PASSWORD: ci-only-not-a-production-secret
      APP_PORT: 8088
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Construir e iniciar o ambiente
        run: docker compose up -d --build --wait
      - name: Instalar navegador de testes
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Executar E2E
        working-directory: frontend
        run: npm run test:e2e
      - name: Publicar relatório E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Exibir logs em caso de falha
        if: failure()
        run: docker compose logs --no-color
      - name: Encerrar ambiente
        if: always()
        run: docker compose down -v

