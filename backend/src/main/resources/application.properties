
spring.application.name=RaveCareApp

# ===============================
# DATABASE
# ===============================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true

# ===============================
# FLYWAY
# ===============================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===============================
# SERVER
# ===============================

server.port=${PORT:8080}

# Never include implementation details or request data in API error responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Keep only the liveness endpoint available by default, without sensitive details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Do not create a generated in-memory administrator account at startup.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

